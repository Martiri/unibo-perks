name: Sync UniBo Public Discounts

on:
  schedule:
    # Ogni lunedì alle 06:30 UTC
    - cron: '30 6 * * 1'
  workflow_dispatch:

# Default least-privilege permissions
permissions:
  contents: read

jobs:
  sync-catalog:
    name: Scrape UniBo & Build Catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r scripts/requirements.txt || pip install -r scripts/requirements.txt

      - name: Run fail-safe UniBo scraper and catalog builder
        run: |
          python scripts/sync_unibo.py

      - name: Commit and push if catalog changed
        run: |
          if git diff --quiet data/scraped_unibo.json data/discounts.json; then
            echo "Nessuna variazione rilevata nei file JSON del catalogo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scraped_unibo.json data/discounts.json
          git commit -m "chore(data): sync UniBo public conventions catalog [skip ci]"
          git push
