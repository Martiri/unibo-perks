name: Build & Release Android APK (UniBo Perks)

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'print_version.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Assemble & Publish Release APK (POCO F7)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract App Version
        id: get_version
        working-directory: .
        run: |
          VERSION=$(./print_version.sh)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: v$VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle with Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: false

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename Signed APK for Release
        run: |
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/UniBo_Perks_v${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniBo-Perks-v${{ env.VERSION }}-apk
          path: android/app/build/outputs/apk/release/UniBo_Perks_v${{ env.VERSION }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          APK_PATH="android/app/build/outputs/apk/release/UniBo_Perks_v${VERSION}.apk"
          NOTES="### UniBo Perks ${TAG} — Native Jetpack Compose (POCO F7 & Play Protect Clean)
          - **100% Play Protect Clean**: solo \`INTERNET\` e \`ACCESS_NETWORK_STATE\` (zero falsi positivi).
          - **120Hz AMOLED Lock**: ottimizzazione nativa per Xiaomi POCO F7 (Android 15 / HyperOS 2).
          - **Firma Permanente RSA-2048**: aggiornamenti in-place diretti senza disinstallazione.
          - **Catalogo Offline Integrato**: 78+ sconti e convenzioni universitarie sempre accessibili."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating APK asset in-place..."
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            echo "Creating new GitHub Release $TAG with direct APK..."
            gh release create "$TAG" "$APK_PATH" \
              --title "UniBo Perks ${TAG} — Native Jetpack Compose (POCO F7 & Play Protect Clean)" \
              --notes "$NOTES" \
              --latest
          fi
